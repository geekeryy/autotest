# 生产 API-only 栈（前端由 Firebase Hosting 提供）。
# DB_MANAGED=docker 时通过 profile bundled-db 启动 compose 内 PostgreSQL；external 时使用 POSTGRES_*。
# 请用 docker compose 启动，见 docs/design/architecture.md#生产部署
services:
  postgres:
    profiles: [bundled-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotest}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autotest} -d ${POSTGRES_DB:-autotest}"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
    image: ${AUTOTEST_IMAGE:-geekeryy/autotest:latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      APP_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotest}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://autotest-one.web.app,https://autotest.jiangyang.online}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

volumes:
  postgres-data:
