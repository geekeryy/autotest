# 可选一体栈：内嵌管理后台的 API 单镜像（非默认生产方案，见 architecture.md#all-in-one可选）。
# DB_MANAGED=docker 时通过 profile bundled-db 启动 PostgreSQL；external 时使用 POSTGRES_*。
# 在项目根目录执行：make all-in-one-up
services:
  postgres:
    profiles: [bundled-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotest}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autotest} -d ${POSTGRES_DB:-autotest}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ../..
      dockerfile: deploy/all-in-one/Dockerfile
    image: ${AUTOTEST_IMAGE:-geekeryy/autotest:latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotest}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-autotest-dev-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-text}

volumes:
  postgres-data:
